<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description"><title id="title">KeyGuard detection architecture</title><desc id="description">Metadata from processes, executable files, startup definitions and TCP peers is combined with scoring weights and allowlists into explainable reports.</desc><rect x="0" y="0" width="1440" height="850" rx="0" fill="#0c1524"/><text x="64" y="82" font-size="44" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">How KeyGuard reaches a risk score</text><text x="64" y="130" font-size="27" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Read-only observations -&gt; weighted evidence -&gt; a report you can review</text><text x="64" y="203" font-size="20" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">OBSERVE</text><text x="558" y="203" font-size="20" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">CORRELATE</text><text x="1030" y="203" font-size="20" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">REVIEW</text><rect x="64" y="235" width="430" height="100" rx="18" fill="#16243a"/><text x="85" y="272" font-size="25" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Processes + windows</text><text x="85" y="308" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Names, paths, age, parent, visibility</text><rect x="64" y="355" width="430" height="100" rx="18" fill="#16243a"/><text x="85" y="392" font-size="25" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">On-disk executables</text><text x="85" y="428" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">PE imports + offline signature trust</text><rect x="64" y="475" width="430" height="100" rx="18" fill="#16243a"/><text x="85" y="512" font-size="25" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Startup definitions</text><text x="85" y="548" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Run keys, folders, tasks, services</text><rect x="64" y="595" width="430" height="100" rx="18" fill="#16243a"/><text x="85" y="632" font-size="25" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">TCP peers</text><text x="85" y="668" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Established non-loopback connections</text><path d="M494 285H524 M494 405H524 M494 525H524 M494 645H524 M524 285V645 M524 325H558" fill="none" stroke="#5e819e" stroke-width="3"/><path d="M548 318L558 325L548 332" fill="none" stroke="#5e819e" stroke-width="3"/><rect x="558" y="235" width="400" height="180" rx="18" fill="#16243a"/><text x="582" y="276" font-size="28" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">One process snapshot</text><text x="582" y="323" font-size="20" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Join evidence by executable + PID</text><text x="582" y="359" font-size="20" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Keep findings and coverage gaps</text><text x="582" y="391" font-size="20" fill="#64e3c4" font-weight="400" font-family="DejaVu Sans,sans-serif">No input or packet contents</text><rect x="558" y="445" width="400" height="130" rx="18" fill="#16243a"/><text x="582" y="484" font-size="28" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Explicit policy</text><text x="582" y="523" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">config.json: scoring weights*</text><text x="582" y="554" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Allowlist: verified rules / path + hash</text><path d="M758 415V445 M758 575V610 M958 650H994V465H1030" fill="none" stroke="#5e819e" stroke-width="3"/><path d="M1020 458L1030 465L1020 472" fill="none" stroke="#5e819e" stroke-width="3"/><rect x="558" y="610" width="400" height="85" rx="18" fill="#15382f"/><text x="582" y="645" font-size="20" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">Deduplicate + apply weights</text><text x="582" y="677" font-size="19" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Sum discounts + risk; clamp to 0-100</text><rect x="1030" y="235" width="346" height="460" rx="18" fill="#16243a"/><text x="1054" y="282" font-size="27" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Explain the result</text><text x="1054" y="338" font-size="23" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">Low / Medium / High</text><text x="1054" y="387" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Human-readable reasons</text><text x="1054" y="432" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Coverage notes</text><text x="1054" y="496" font-size="20" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">CLI: scan / inspect / watch</text><text x="1054" y="541" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Offline JSON / HTML</text><text x="1054" y="617" font-size="24" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">A score is not proof</text><text x="1054" y="654" font-size="24" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">of keylogging.</text><text x="64" y="757" font-size="22" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">* Weights are configurable. Risk tiers stay fixed: Low 0-29 / Medium 30-59 / High 60-100.</text><text x="64" y="805" font-size="22" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">User-mode coverage cannot establish the absence of kernel-level or rootkit keyloggers.</text></svg>
