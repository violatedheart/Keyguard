<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description"><title id="title">KeyGuard visual quick start</title><desc id="description">Scan, inspect a PID from your results, and export HTML. Scores are heuristic. Read coverage notes.</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#0c1524"/><text x="64" y="82" font-size="48" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">KeyGuard</text><text x="64" y="129" font-size="28" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">From a first scan to an evidence report</text><rect x="1070" y="48" width="306" height="44" rx="22" fill="#15382f"/><text x="1092" y="78" font-size="19" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">READ-ONLY / WINDOWS</text><text x="64" y="188" font-size="23" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Extract the Windows artifact ZIP. Open PowerShell in the folder containing keyguard.exe.</text><rect x="64" y="228" width="420" height="314" rx="18" fill="#16243a"/><text x="88" y="276" font-size="23" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">01</text><text x="88" y="322" font-size="34" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Scan</text><text x="88" y="375" font-size="20" fill="#64e3c4" font-weight="400" font-family="DejaVu Sans Mono,monospace">.\keyguard.exe scan</text><text x="88" y="472" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">See Medium and High processes.</text><text x="88" y="502" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Use scan --all to include Low.</text><rect x="510" y="228" width="420" height="314" rx="18" fill="#16243a"/><text x="534" y="276" font-size="23" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">02</text><text x="534" y="322" font-size="34" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Inspect</text><text x="534" y="375" font-size="20" fill="#64e3c4" font-weight="400" font-family="DejaVu Sans Mono,monospace">.\keyguard.exe inspect 4242</text><text x="534" y="472" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Read reasons and coverage notes.</text><text x="534" y="502" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Use a PID from your own scan.</text><rect x="956" y="228" width="420" height="314" rx="18" fill="#16243a"/><text x="980" y="276" font-size="23" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">03</text><text x="980" y="322" font-size="34" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Export</text><text x="980" y="375" font-size="20" fill="#64e3c4" font-weight="400" font-family="DejaVu Sans Mono,monospace">.\keyguard.exe export --html `</text><text x="980" y="403" font-size="20" fill="#64e3c4" font-weight="400" font-family="DejaVu Sans Mono,monospace">--output report.html</text><text x="980" y="472" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Save a fresh, complete scan.</text><text x="980" y="502" font-size="21" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Open the HTML file locally.</text><text x="64" y="604" font-size="28" fill="#edf4ff" font-weight="700" font-family="DejaVu Sans,sans-serif">Read the score as a triage priority</text><rect x="64" y="632" width="420" height="72" rx="18" fill="#16243a"/><text x="88" y="678" font-size="25" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">0-29  LOW</text><rect x="510" y="632" width="420" height="72" rx="18" fill="#16243a"/><text x="534" y="678" font-size="25" fill="#ffd17d" font-weight="700" font-family="DejaVu Sans,sans-serif">30-59  MEDIUM</text><rect x="956" y="632" width="420" height="72" rx="18" fill="#16243a"/><text x="980" y="678" font-size="25" fill="#ff9b9b" font-weight="700" font-family="DejaVu Sans,sans-serif">60-100  HIGH</text><text x="64" y="752" font-size="23" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">High is a reason to investigate. Low with missing evidence does not establish safety.</text><text x="64" y="795" font-size="22" fill="#b3c4dc" font-weight="400" font-family="DejaVu Sans,sans-serif">Coverage limited? Run as administrator when appropriate. KeyGuard never elevates itself.</text><text x="64" y="850" font-size="24" fill="#64e3c4" font-weight="700" font-family="DejaVu Sans,sans-serif">No keystroke capture. No injection. No process-control actions.</text></svg>
